<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="שעון נוכחות">
  <title>שעון נוכחות</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 1.3em; margin: 20px 0 4px; color: #a0c4ff; }
    #clock { font-size: 3em; font-weight: bold; margin: 10px 0; letter-spacing: 3px; }
    #date-display { font-size: 0.9em; color: #aaa; margin-bottom: 20px; }
    .btn {
      width: 100%; max-width: 340px;
      padding: 20px; font-size: 1.2em; font-weight: bold;
      border: none; border-radius: 14px; cursor: pointer;
      margin: 8px 0; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; }
    #btn-in   { background: #27ae60; color: white; }
    #btn-out  { background: #e74c3c; color: white; }
    #btn-sub  { background: #2980b9; color: white; margin-top: 16px; }
    #btn-view { background: #555; color: white; font-size: 0.9em; padding: 12px; }
    #btn-fill { background: #8e44ad; color: white; font-size: 0.9em; padding: 12px; }
    #status {
      margin: 12px 0; padding: 12px 16px; border-radius: 10px;
      font-size: 0.95em; text-align: center;
      max-width: 340px; width: 100%; display: none;
    }
    #status.ok  { background:#1e3a2e; border:1px solid #27ae60; color:#27ae60; }
    #status.err { background:#3a1e1e; border:1px solid #e74c3c; color:#e74c3c; }
    #status.info{ background:#1e2a3a; border:1px solid #2980b9; color:#7fb3d3; }
    #records-panel {
      width: 100%; max-width: 340px;
      background: #252540; border-radius: 12px;
      margin-top: 14px; overflow: hidden; display: none;
    }
    #records-panel h3 { padding: 10px 14px; background: #333; font-size: 0.95em; }
    .rec-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px; border-bottom: 1px solid #333; font-size: 0.88em;
    }
    .rec-row .date { color: #aaa; }
    .rec-row .times { color: white; }
    .rec-row .del { color: #e74c3c; cursor: pointer; padding: 2px 6px; }
    .rec-row.submitted { opacity: 0.5; }
    #config-link { margin-top: 16px; font-size: 0.78em; color: #555; }
    #config-link a { color: #a0c4ff; }
    .badge {
      display: inline-block; background: #e74c3c;
      color: white; border-radius: 10px; font-size: 0.7em;
      padding: 2px 7px; margin-right: 6px; vertical-align: middle;
    }
    .actions { display: flex; gap: 4px; align-items: center; }
    .edit   { color: #a0c4ff; cursor: pointer; padding: 2px 6px; }
    .save   { color: #27ae60; cursor: pointer; padding: 2px 6px; }
    .cancel { color: #aaa;    cursor: pointer; padding: 2px 6px; }
    .rec-row input[type="time"] {
      background: #333; border: 1px solid #555; color: white;
      border-radius: 6px; padding: 2px 4px; font-size: 0.85em; width: 76px;
    }
  </style>
</head>
<body>
<h1>⏱ שעון נוכחות</h1>
<div id="clock">--:--:--</div>
<div id="date-display"></div>

<button class="btn" id="btn-in"  onclick="punch('IN')">🟢 כניסה</button>
<button class="btn" id="btn-out" onclick="punch('OUT')">🔴 יציאה</button>
<div id="status"></div>

<button class="btn" id="btn-sub" onclick="submitAll()">
  📤 שלח ל-Isufit <span id="pending-badge" class="badge" style="display:none">0</span>
</button>
<button class="btn" id="btn-view" onclick="toggleRecords()">📋 הצג רשומות שמורות</button>
<button class="btn" id="btn-fill" onclick="fillEmptyDays()">🎲 מלא ימים ריקים</button>

<div id="records-panel">
  <h3 style="display:flex;justify-content:space-between;align-items:center;">
    <span>רשומות שמורות</span>
    <span onclick="clearAllRecords()" style="cursor:pointer;font-size:0.8em;color:#e74c3c;">🗑️ נקה הכל</span>
  </h3>
  <div id="records-list"></div>
</div>

<div id="config-link">
  עובד: <strong id="display-worker"></strong> |
  <a href="#" onclick="showConfig()">הגדרות</a> |
  <a href="#" id="bookmarklet-link" title="גרור לסרגל הסימניות של הדפדפן">📌 סימניית שליפה</a>
</div>

<script>
const ISUFIT = 'https://extisufit.ngsoft.com/isufit';
const ISUFIT_CALENDAR_URL = `${ISUFIT}/MainPage.aspx`;
const REMOTE_STATUS_KEY = 'isufit_remote_status';
const REMOTE_STATUS_MAX_AGE_MS = 6 * 60 * 60 * 1000;
let workerCode = localStorage.getItem('isufit_worker') || '';
let loginOpened = false;
let editingDate = null;
let pendingFill = false;
document.getElementById('display-worker').textContent = workerCode || 'לא הוגדר';

// ── Clock ──────────────────────────────────────────
function tick() {
  const n = new Date();
  const pad = x => String(x).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני',
                  'יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('date-display').textContent =
    `יום ${days[n.getDay()]}, ${n.getDate()} ${months[n.getMonth()]} ${n.getFullYear()}`;
}
setInterval(tick, 1000); tick();

// ── Helpers ────────────────────────────────────────
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function nowHHMM() {
  const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}
function getAllRecords() {
  return JSON.parse(localStorage.getItem('isufit_records') || '{}');
}
function saveAllRecords(obj) {
  localStorage.setItem('isufit_records', JSON.stringify(obj));
  updateBadge();
}
function getRemoteStatus() {
  return JSON.parse(localStorage.getItem(REMOTE_STATUS_KEY) || 'null');
}
function saveRemoteStatus(status) {
  localStorage.setItem(REMOTE_STATUS_KEY, JSON.stringify(status));
}
function remoteStatusIsFresh(status, monthKey) {
  // An empty result is far more likely to mean detection failed than that
  // literally no day is marked, so never trust it as "done" — always retry.
  return !!status && status.month === monthKey
    && Object.keys(status.days).length > 0
    && (Date.now() - status.fetchedAt) < REMOTE_STATUS_MAX_AGE_MS;
}

// ── Punch ──────────────────────────────────────────
function punch(type) {
  const key   = todayKey();
  const time  = nowHHMM();
  const recs  = getAllRecords();
  if (!recs[key]) recs[key] = { in: '', out: '', submitted: false };
  if (type === 'IN') {
    recs[key].in = time;
    showStatus(`✅ כניסה נשמרה: ${time}`, 'ok');
  } else {
    recs[key].out = time;
    showStatus(`✅ יציאה נשמרה: ${time}`, 'ok');
  }
  saveAllRecords(recs);
  renderRecords();
}

// ── Submit all ─────────────────────────────────────
async function submitAll() {
  if (!workerCode) {
    showStatus('⚠️ נא להגדיר קוד עובד בהגדרות', 'err');
    showConfig();
    return;
  }
  const recs = getAllRecords();
  const pending = Object.entries(recs).filter(([,v]) => !v.submitted && (v.in || v.out));
  if (pending.length === 0) {
    showStatus('אין רשומות חדשות לשליחה', 'info');
    return;
  }

  if (!loginOpened) {
    const win = window.open(`${ISUFIT}/login.aspx`, 'isufit_submit');
    if (!win) {
      showStatus('⚠️ נא לאפשר חלונות קופצים (popups) לאתר זה', 'err');
      return;
    }
    loginOpened = true;
    showStatus('🔐 התחבר ל-Isufit בחלון שנפתח, ואז לחץ שוב על "שלח"', 'info', true);
    return;
  }

  const submitWin = window.open('', 'isufit_submit');
  if (!submitWin) {
    showStatus('⚠️ נא לאפשר חלונות קופצים (popups) לאתר זה', 'err');
    loginOpened = false;
    return;
  }

  showStatus(`⏳ שולח ${pending.length} ימים...`, 'info');
  document.getElementById('btn-sub').disabled = true;
  let ok = 0, fail = 0;
  for (const [date, rec] of pending) {
    if (submitWin.closed) {
      showStatus('⚠️ חלון השליחה נסגר. נא לנסות שוב', 'err');
      fail++;
      break;
    }
    if (rec.in) {
      const success = sendRecord(date, 'IN122', rec.in);
      if (success) ok++; else fail++;
      await sleep(1500);
    }
    if (rec.out) {
      const success = sendRecord(date, 'OUT122', rec.out);
      if (success) ok++; else fail++;
      await sleep(1500);
    }
    if (fail === 0) {
      recs[date].submitted = true;
    }
  }
  saveAllRecords(recs);
  renderRecords();
  document.getElementById('btn-sub').disabled = false;
  await sleep(500);
  if (submitWin && !submitWin.closed) {
    window.open(`${ISUFIT}/MainPage.aspx`, 'isufit_submit');
  }
  loginOpened = false;
  if (fail === 0) {
    showStatus(`✅ נשלחו ${ok} רשומות — בדוק ב-Isufit שהנתונים עודכנו`, 'ok');
  } else {
    showStatus(`⚠️ ${ok} הצליחו, ${fail} נכשלו. נסה שוב`, 'err');
  }
}

function sendRecord(date, tbName, value) {
  try {
    const form = document.createElement('form');
    form.method = 'GET';
    form.action = `${ISUFIT}/ops/opSaveTBChange.aspx`;
    form.target = 'isufit_submit';
    form.style.display = 'none';
    [['workerCode', workerCode], ['forDate', date], ['tbName', tbName], ['newVal', value], ['caller', 'main']].forEach(([n, v]) => {
      const inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = n; inp.value = v;
      form.appendChild(inp);
    });
    document.body.appendChild(form);
    form.submit();
    form.remove();
    return true;
  } catch (e) {
    return false;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function calcDuration(inTime, outTime) {
  if (!inTime || !outTime) return '';
  const [inH,  inM]  = inTime.split(':').map(Number);
  const [outH, outM] = outTime.split(':').map(Number);
  const diff = (outH * 60 + outM) - (inH * 60 + inM);
  if (diff <= 0) return '';
  const h = Math.floor(diff / 60);
  const m = diff % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

// ── UI helpers ─────────────────────────────────────
function showStatus(msg, type, persist) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = type; el.style.display = 'block';
  if (!persist && type !== 'err') setTimeout(() => el.style.display = 'none', 5000);
}

function updateBadge() {
  const recs = getAllRecords();
  const count = Object.values(recs).filter(v => !v.submitted && (v.in || v.out)).length;
  const badge = document.getElementById('pending-badge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'inline-block' : 'none';
}

function toggleRecords() {
  const panel = document.getElementById('records-panel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  renderRecords();
}

function renderRecords() {
  const recs = getAllRecords();
  const list = document.getElementById('records-list');
  list.textContent = '';
  const sorted = Object.keys(recs).sort().reverse();
  if (sorted.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'rec-row';
    empty.style.color = '#666';
    empty.textContent = 'אין רשומות';
    list.appendChild(empty);
    return;
  }
  for (const date of sorted) {
    const r = recs[date];
    const row = document.createElement('div');
    row.className = 'rec-row' + (r.submitted ? ' submitted' : '');

    const dateSpan = document.createElement('span');
    dateSpan.className = 'date';
    dateSpan.textContent = date + (r.submitted ? ' ✓' : '');

    const timesSpan = document.createElement('span');
    timesSpan.className = 'times';
    timesSpan.id = 'times-' + date;
    timesSpan.textContent = '🟢 ' + (r.in||'--') + ' \u00a0 🔴 ' + (r.out||'--');
    const dur = calcDuration(r.in, r.out);
    if (dur) timesSpan.append('\u00a0 \u23f1 ' + dur);

    const actionsSpan = document.createElement('span');
    actionsSpan.className = 'actions';
    actionsSpan.id = 'actions-' + date;

    const editSpan = document.createElement('span');
    editSpan.className = 'edit';
    editSpan.textContent = '✏️';
    editSpan.onclick = () => editRecord(date);

    const delSpan = document.createElement('span');
    delSpan.className = 'del';
    delSpan.textContent = '✕';
    delSpan.onclick = () => deleteRecord(date);

    actionsSpan.append(editSpan, delSpan);
    row.append(dateSpan, timesSpan, actionsSpan);
    list.appendChild(row);
  }
}

function deleteRecord(date) {
  if (!confirm(`מחק רשומה לתאריך ${date}?`)) return;
  const recs = getAllRecords();
  delete recs[date];
  saveAllRecords(recs);
  renderRecords();
}

function clearAllRecords() {
  if (!confirm('למחוק את כל הרשומות השמורות? הפעולה בלתי הפיכה.')) return;
  saveAllRecords({});
  renderRecords();
  showStatus('🗑️ כל הרשומות נמחקו', 'ok');
}

function editRecord(date) {
  if (editingDate) cancelEdit(editingDate);
  editingDate = date;
  const r = getAllRecords()[date];

  const timesEl   = document.getElementById('times-'   + date);
  const actionsEl = document.getElementById('actions-' + date);

  const inInput  = document.createElement('input');
  inInput.type   = 'time';
  inInput.id     = 'edit-in-' + date;
  inInput.value  = r.in  || '';

  const outInput  = document.createElement('input');
  outInput.type   = 'time';
  outInput.id     = 'edit-out-' + date;
  outInput.value  = r.out || '';

  timesEl.textContent = '';
  timesEl.append('\uD83D\uDFE2 ', inInput, '\u00a0 \uD83D\uDD34 ', outInput);

  const saveBtn = document.createElement('span');
  saveBtn.className   = 'save';
  saveBtn.textContent = '\u2713';
  saveBtn.onclick     = () => saveRecord(date);

  const cancelBtn = document.createElement('span');
  cancelBtn.className   = 'cancel';
  cancelBtn.textContent = '\u2717';
  cancelBtn.onclick     = () => cancelEdit(date);

  actionsEl.textContent = '';
  actionsEl.append(saveBtn, cancelBtn);
}

function saveRecord(date) {
  const recs       = getAllRecords();
  recs[date].in    = document.getElementById('edit-in-'  + date).value;
  recs[date].out   = document.getElementById('edit-out-' + date).value;
  recs[date].submitted = false;
  editingDate      = null;
  saveAllRecords(recs);
  renderRecords();
}

function cancelEdit(date) {
  editingDate = null;
  renderRecords();
}


function currentMonthKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
}

// Entry point for the fill button. If we don't have fresh data on which
// days are already occupied on the real Isufit site (symbol days like
// sick/vacation, or days that already have hours filled in there), we
// open the site's calendar and wait for the bookmarklet to report back
// via postMessage before actually filling — see the message listener below.
function fillEmptyDays() {
  const monthKey = currentMonthKey();
  const remote = getRemoteStatus();
  if (remoteStatusIsFresh(remote, monthKey)) {
    runFill(remote.days);
    return;
  }

  const win = window.open(ISUFIT_CALENDAR_URL, 'isufit_submit');
  if (!win) {
    showStatus('⚠️ נא לאפשר חלונות קופצים (popups) לאתר זה', 'err');
    return;
  }
  pendingFill = true;
  showStatus('📋 פתחתי את לוח הנוכחות — לחץ שם על הסימנייה "📌 סימניית שליפה", והמילוי ימשיך אוטומטית', 'info', true);
}

function runFill(remoteDays) {
  remoteDays = remoteDays || {};
  const recs = getAllRecords();
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const pad = x => String(x).padStart(2, '0');
  const toHHMM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

  const todayStr = toKey(now);
  let count = 0;

  for (const d = new Date(year, month, 1); toKey(d) <= todayStr; d.setDate(d.getDate() + 1)) {
    const day = d.getDay();
    const key = toKey(d);
    if (day === 5 || day === 6 || recs[key] || remoteDays[key]) continue;

    const enterMin = 450 + Math.floor(Math.random() * 121);
    const exitLow  = Math.max(960,  enterMin + 480);
    const exitHigh = Math.min(1140, enterMin + 600);
    const exitMin  = exitLow + Math.floor(Math.random() * (exitHigh - exitLow + 1));

    recs[key] = { in: toHHMM(enterMin), out: toHHMM(exitMin), submitted: false };
    count++;
  }

  if (count === 0) {
    showStatus('אין ימים ריקים למילוי', 'info');
    return;
  }

  saveAllRecords(recs);
  const panel = document.getElementById('records-panel');
  if (panel.style.display !== 'block') panel.style.display = 'block';
  renderRecords();
  showStatus(`✅ נוצרו ${count} רשומות`, 'ok');
}

function showConfig() {
  const code = prompt('קוד עובד (Worker Code):', workerCode);
  if (code && code.trim()) {
    workerCode = code.trim();
    localStorage.setItem('isufit_worker', workerCode);
    document.getElementById('display-worker').textContent = workerCode;
    showStatus('✅ קוד עובד עודכן', 'ok');
  }
}

// ── Isufit calendar bookmarklet ─────────────────────
// Ran manually by the user while the Isufit calendar page (opened via
// fillEmptyDays above) is the active tab. It reads that page's own DOM
// (same-origin there, so no CORS issue) and posts the result back to
// this app's window via postMessage.
//
// MainPage.aspx is a shell page — the actual per-day grid (table#centerTable,
// rows <tr id="TR2026-08-4">) loads inside <iframe id="mainTableFrame">, not
// in the top document. Each row's <select name="...SML122"> holds the day's
// symbol (option value "0" = none; otherwise its label text contains the
// same words mapSymbolToStatus checks for), and IN*/OUT* inputs hold any
// hours already worked.
function buildBookmarkletCode() {
  const targetOrigin = (location.protocol === 'file:' || location.origin === 'null')
    ? '*' : location.origin;

  const src = `(function(){
    function mapSymbolToStatus(text) {
      if (!text) return null;
      if (text.indexOf('מחלה') !== -1) return 'sick';
      if (text.indexOf('חופש') !== -1) return 'vacation';
      if (text.indexOf('מילואים') !== -1) return 'reserve';
      if (text.indexOf('חג') !== -1) return 'holiday';
      return null;
    }

    // The grid is inside <iframe id="mainTableFrame">, not the top document.
    function getGridDocument() {
      var frame = document.getElementById('mainTableFrame');
      if (!frame) return null;
      try {
        return frame.contentDocument || frame.contentWindow.document;
      } catch (e) {
        return null; // cross-origin or not yet loaded
      }
    }

    // Each day is <tr id="TR2026-08-4"> (day not zero-padded). Symbol lives
    // in a <select name="...SML122"> whose selected option's label (e.g.
    // "902-ש.מחלה") already contains the words mapSymbolToStatus checks for.
    // Worked hours live in the IN*/OUT* inputs for up to 3 shifts.
    var HOUR_FIELD_SUFFIXES = ['IN122', 'OUT122', 'IN222', 'OUT222', 'IN322', 'OUT322'];

    // Single source of truth for "what is this row" — both extractDays and
    // the debug scan below call this, so they can never silently disagree.
    function classifyRow(row) {
      var select = row.querySelector('select[name$="SML122"]');
      var selectedOpt = select ? select.options[select.selectedIndex] : null;
      var status = (selectedOpt && selectedOpt.value !== '0')
        ? mapSymbolToStatus(selectedOpt.text)
        : null;

      if (!status) {
        for (var j = 0; j < HOUR_FIELD_SUFFIXES.length; j++) {
          var input = row.querySelector('input[name$="' + HOUR_FIELD_SUFFIXES[j] + '"]');
          if (input && input.value) { status = 'filled'; break; }
        }
      }
      return { status: status, select: select, selectedOpt: selectedOpt };
    }

    // One pass, one querySelectorAll, one loop — builds both the real result
    // (days) and the debug info from literally the same iteration, so there
    // is no way for "what we found" and "what we'd report as a diagnostic"
    // to ever disagree with each other.
    function scanGrid(gridDoc) {
      var rows = gridDoc.querySelectorAll('tr[id^="TR"]');
      var days = {};
      var debug = { rowCount: rows.length, nonDefaultCount: 0 };
      var firstNonDefault = null;

      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var result = classifyRow(row);

        if (result.status && !firstNonDefault) {
          firstNonDefault = { row: row, select: result.select, selOpt: result.selectedOpt, status: result.status };
        }
        if (result.status) debug.nonDefaultCount++;

        var m = row.id.match(/^TR(\\d{4})-(\\d{2})-(\\d{1,2})$/);
        if (!m) continue;
        var date = m[1] + '-' + m[2] + '-' + (m[3].length === 1 ? '0' + m[3] : m[3]);
        if (result.status) days[date] = result.status;
      }

      if (firstNonDefault) {
        debug.rowId = firstNonDefault.row.id;
        debug.status = firstNonDefault.status;
        debug.selectName = firstNonDefault.select ? firstNonDefault.select.name : '';
        debug.selectedValue = firstNonDefault.selOpt ? firstNonDefault.selOpt.value : '';
        debug.selectedText = firstNonDefault.selOpt ? firstNonDefault.selOpt.text : '';
      }
      return { days: days, debug: debug };
    }

    // Feedback goes back to the app via postMessage rather than alert() —
    // repeated alert()s on this tab get silently blocked by Chrome after a
    // few in a row ("Prevent this page from creating additional dialogs").
    if (!window.opener) {
      return; // can't report anywhere meaningful if not opened by the app
    }

    // Confirmed via HAR capture: MainPage.aspx is a shell — the iframe only
    // gets the real grid via a SEPARATE request to MainTable.aspx that fires
    // ~1.5s after MainPage.aspx itself loads, then takes another ~1.5s to
    // fully settle (its own CSS/JS). Retry generously to cover that.
    function attempt(retriesLeft) {
      var gridDoc = getGridDocument();
      if (!gridDoc) {
        if (retriesLeft > 0) { setTimeout(function () { attempt(retriesLeft - 1); }, 500); return; }
        window.opener.postMessage({ source: 'isufit-bookmarklet', error: 'no-grid-frame' }, '${targetOrigin}');
        return;
      }
      var result = scanGrid(gridDoc);
      var days = result.days;
      var count = Object.keys(days).length;
      if (count === 0 && retriesLeft > 0) {
        setTimeout(function () { attempt(retriesLeft - 1); }, 500);
        return;
      }

      var payload = { source: 'isufit-bookmarklet', days: days };
      if (count === 0) {
        payload.debug = result.debug;
      } else {
        // Assumes the calendar page is currently showing the real-world
        // current month — true for the fillEmptyDays flow that opens it.
        var now = new Date();
        payload.month = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      }
      window.opener.postMessage(payload, '${targetOrigin}');
    }

    attempt(16); // up to ~8s total — comfortably covers the observed ~3s gap
  })();`;

  // Note: do NOT collapse whitespace/newlines here — the `//` comments
  // above would swallow the code that follows them on the same line.
  return 'javascript:' + encodeURIComponent(src);
}

function initBookmarkletLink() {
  const link = document.getElementById('bookmarklet-link');
  link.href = buildBookmarkletCode();
  link.onclick = (e) => {
    e.preventDefault();
    showStatus('גרור קישור זה לסרגל הסימניות של הדפדפן, ולחץ עליו כשאתה בלוח הנוכחות של Isufit', 'info', true);
  };
}

// ── Receive data pulled by the bookmarklet ──────────
window.addEventListener('message', (event) => {
  if (event.origin !== new URL(ISUFIT).origin) return;
  const data = event.data;
  if (!data || data.source !== 'isufit-bookmarklet') return;

  if (data.error) {
    pendingFill = false;
    showStatus(`⚠️ הסימנייה נכשלה: ${data.error}`, 'err', true);
    return;
  }
  if (!data.days) return;

  const count = Object.keys(data.days).length;

  // DEBUG: 0 days found — show the diagnostic instead of silently
  // resuming the fill with empty skip data (that's what caused the
  // earlier bug where symbol days got filled with fake hours).
  if (count === 0 && data.debug) {
    pendingFill = false;
    console.log('bookmarklet debug:', data.debug);
    const d = data.debug;
    showStatus(
      `DEBUG rows=${d.rowCount} nonDefault=${d.nonDefaultCount} ` +
      `firstRowId="${d.rowId || ''}" status="${d.status || ''}" selectName="${d.selectName || ''}" ` +
      `selectedValue="${d.selectedValue || ''}" selectedText="${d.selectedText || ''}"`,
      'err', true
    );
    return;
  }

  saveRemoteStatus({ month: data.month, fetchedAt: Date.now(), days: data.days });

  if (pendingFill) {
    pendingFill = false;
    runFill(data.days);
  } else {
    showStatus(`✅ עודכנו נתוני האתר (${count} ימים מסומנים)`, 'ok');
  }
});

// Init
updateBadge();
initBookmarkletLink();
</script>
</body>
</html>
